apiVersion: apps/v1
kind: Deployment
metadata: { name: consentledger, labels: { app: consentledger } }
spec:
  replicas: 1
  selector: { matchLabels: { app: consentledger } }
  template:
    metadata: { labels: { app: consentledger } }
    spec:
      containers:
        - name: consentledger
          image: ghcr.io/cognis-digital/consentledger:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: consentledger }
spec:
  selector: { app: consentledger }
  ports: [{ port: 80, targetPort: 8000 }]
